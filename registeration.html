<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            .t{
                color: aliceblue;
            margin-top: 60px;
            display: flex;
            justify-content: center;
                font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 600;
            font-variant: small-caps;
        }
        </style>
    </head>

    <body>
        <header class="navbar-dark bg-black py-3 text-center">
            <!-- <nav
                class="navbar navbar-expand-sm navbar-dark bg-black py-3 text-center  "
            > -->

                <div class="container text-center ">
                    <img
                        src="image/TechNova.png"
                        class="img-fluid rounded-circle "
                        alt=""
                        height="50px"
                        width="50px"

                    />
            </div>
            

            <!-- place navbar here -->
        </header>
    
        <main>
            <div
                class="container "
            >
            <div class="toast-container position-fixed top-2  text-center  p-3"
            style="left: 38%;"
            aria-live="polite" aria-atomic="true">
            <div id="cart-toast" class="toast" role="status">
                <div class="toast-header">
                    <strong class="me-auto">TechNova Store</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body"
                style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-weight: 500;"
                >Form Submitted Succesfully </div>
            </div>
        </div>
        </div>

            <div
                class="container mt-5"
            >
            <label for="">Step 1 of 3</label>
                <div class="progress"
                style="height: 20px;"
                >
                
                    <div
                        class="progress-bar progress-bar-striped progress-bar-animated bg-primary "
                        role="progressbar"
                        style="width: 25%;"
                        aria-valuenow="25"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >
                        33%
                    </div>
                </div>
                
            </div>

                <div
                    class="container"
                >
                    <div id="passwordError"
                         class="alert alert-danger alert-dismissible fade show d-none"
                         role="alert">
                        <strong>Password mismatch!</strong>
                        Password and Confirm Password must match.

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close"></button>
                    </div>
                </div>
                <div
                    class="container mt-5"
                >
                    <div
                        class="alert alert-primary alert-dismissible fade show"
                        role="alert"
                    >
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"
                        ></button>
                        <strong>Password confirmation</strong> Password and the confirm password should be shame 
                    </div>
                    
                    
                    
                </div>
                <div
                    class="container "
                >
                   <h1 class="t text-dark">Registeration Form</h1>
                </div>
                <div
                    class="container mt-5"
                    
                >
                    <div
                        class="row justify-content-center align-items-center g-2"
                    >
                        
                        <div class="col-3"><div class="mb-3">
                            <label for="" class="form-label">Name :</label>
                            <input
                                type="text"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="Saurabh"
                                required
                            />
                            
                        </div>
                        </div>
                        
                    </div>
                    <div
                        class="row justify-content-center align-items-center g-2"
                    >
                        <div class="col-3"><div class="mb-3">
                            <label for="" class="form-label">Email :</label>
                            <input
                                type="email"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="technova@gmail.com"
                                aria-required="true"
                            />
                            
                        </div>
                        </div>
                        
                    </div>
                    <div
                        class="row justify-content-center align-items-center g-2"
                    >
                        <div class="col-3"><div class="mb-3">
                        <label for="" class="form-label">Password :</label>
                        <input
                            type="password"
                            class="form-control"
                            name=""
                            id=""
                            placeholder="********"
                        />
                    </div></div>
                    <div
                        class="row justify-content-center align-items-center g-2"
                    >
                        <div class="col-3"><div class="mb-3">
                            <label for="" class="form-label">Confirm Password:</label>
                            <input
                                type="password"
                                class="form-control"
                                name=""
                                id=""
                                placeholder="********"
                            />
                        </div>
                        </div>
                        </div>
                        <div
                            class="row justify-content-center align-items-center g-2"
                        >
                            <div class="col-3">
                                <label for="">Gender : </label>&nbsp; &nbsp; &nbsp;&nbsp;&nbsp; 
                                <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name=""
                                    id=""
                                    value="{2:option1}"
                                />
                                <label class="form-check-label" for="">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name=""
                                    id=""
                                    value="option2"
                                />
                                <label class="form-check-label" for="">Female</label>
                            </div>
                            
                            </div>
                            
                        </div>
                        
                        
                    </div>
                    <div
                        class="row justify-content-center align-items-center g-2 mt-3"
                    >
                        <div class="col-3"><div class="mb-3">
                            <label for="" class="form-label">Country :</label>
                            <input
                                type="text"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="eg. India"
                            />
                            
                        </div>
                        </div>
                        
                    </div>
                    <div
                        class="row justify-content-center align-items-center g-2 mt-2"
                    >
                        <div class="col-3"><div class="mb-3">
                            <label for="" class="form-label">DOB :</label>
                            <input
                                type="date"
                                class="form-control"
                                name=""
                                id=""
                                aria-describedby="helpId"
                                placeholder="01/01/2001"
                            />
                            
                        </div>
                        </div>
                        
                    </div>
                    <div
                        class="row justify-content-center align-items-center g-2"
                    >
                        <div class="col-3"><div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="" />
                            <label class="form-check-label" for=""> 

                            <!-- <button
                                type="button"
                                class="btn btn-primary btn-lg"
                                data-bs-toggle="modal"
                                data-bs-target="#modalId"
                            >
                                Launch
                            </button> -->
                            <a href=""
                            style="text-decoration: none; "
                            class="btn-primary btn-lg"
                                data-bs-toggle="modal"
                                data-bs-target="#modalId"
                            >I accept the Terms and Conditions</a>
                            
                            <!-- Modal Body -->
                            <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
                            <div
                                class="modal fade"
                                id="modalId"
                                tabindex="-1"
                                data-bs-backdrop="static"
                                data-bs-keyboard="false"
                                
                                role="dialog"
                                aria-labelledby="modalTitleId"
                                aria-hidden="true"
                            >
                                <div
                                    class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
                                    role="document"
                                >
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="modalTitleId">
                                                Terms and condition
                                            </h5>
                                            <button
                                                type="button"
                                                class="btn-close"
                                                data-bs-dismiss="modal"
                                                aria-label="Close"
                                            ></button>
                                        </div>
                                        <div class="modal-body">Their is no gurantee of the data hidding of the user </div>
                                        
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Optional: Place to the bottom of scripts
                            <script>
                                const myModal = new bootstrap.Modal(
                                    document.getElementById("modalId"),
                                    options,
                                );
                            </script> -->
                             </label>
                        </div>
                        
                            
                        </div>
                        </div>
                        <div
                            class="row justify-content-center align-items-center g-2 mt-3 mb-5"
                        >
                            <div class="col-3 text-center"><a
                                name=""
                                id=""
                                class="btn btn-primary submit-form"
                                href="#"
                                role="submit"
                                >Submit</a
                            >
                            </div>
                            
                        </div>
                        

                        
                    </div>
                    
                    
                    
                    
                        
                    
                    
                    
                    
                    
                
                
                
                
                
            
        </main>
        <footer class=" text-center py-4 bg-black text-light " style="font-size: larger; font-family: monospace;">
            &copy; 2026 TechNova Store. All rights reserved            
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script>
                        var alertList = document.querySelectorAll(".alert");
                        alertList.forEach(function (alert) {
                            new bootstrap.Alert(alert);
                        });
                    </script>
                    <script>
            const toastEl = document.getElementById("cart-toast");
            const cartToast = bootstrap.Toast.getOrCreateInstance(toastEl);

            document.querySelectorAll(".submit-form").forEach((button) => {
                button.addEventListener("click", () => cartToast.show());
            });
        </script>
    </body>
</html>
