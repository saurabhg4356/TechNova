        <main>
            <div

            >
                <div
                    class="alert alert-danger alert-dismissible fade show text-center my-5"
                    role="alert"
                >
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                
                    <strong>Invalid email or password</strong>
                </div>

            <div

            >
                <h1 class="t"> Login Form</h1>
            </div>
            <div
                class="container"
            >
                <div
                    class="row justify-content-center align-items-center g-2 mt-5"
                >
                    <div class="col-3"><div class="mb-3">
                        <label for="" class="form-label">Email :</label>
                        <input
                            type="email"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder="technova@gmail.com"
                        />
                        
                    </div>
                    </div>
                    
                </div>
                <div
                    class="row justify-content-center align-items-center g-2"
                >
                    <div class="col-3"><div class="mb-3">
                        <label for="" class="form-label">Passowrd :</label>
                        <input
                            type="password"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder="********"
                        />
                        
                    </div>
                    </div>
                   
                </div>
                <div
                    class="row justify-content-center align-items-center g-2"
                >
                    <div class="col-3"><!-- Modal trigger button -->
                    <!-- <button
                        type="button"
                        class="btn btn-primary btn-lg"
                        data-bs-toggle="modal"
                        data-bs-target="#modalId"
                    >
                        Launch
                    </button> -->
                    <a href=""
                    class=""
                    data-bs-toggle="modal"
                        data-bs-target="#modalId"
                        style="text-decoration: none;"
                    >Forgot Password?</a>
                    
                    <!-- Modal Body -->
                    <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
                    <div
                        class="modal fade"
                        id="modalId"
                        tabindex="-1"
                        data-bs-backdrop="static"
                        data-bs-keyboard="false"
                        
                        role="dialog"
                        aria-labelledby="modalTitleId"
                        aria-hidden="true"
                    >
                        <div
                            class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
                            role="document"
                        >
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="modalTitleId">
                                        <div class="mb-3">
                                            <label for="" class="form-label">Email</label>
                                            <input
                                                type="email"
                                                class="form-control"
                                                name=""
                                                id=""
                                                aria-describedby="emailHelpId"
                                                placeholder="abc@mail.com"
                                            />
                                            
                                        </div>
                                        
                                    </h5>
                                    <button
                                        type="button"
                                        class="btn-close mb-5"
                                        data-bs-dismiss="modal"
                                        aria-label="Close"
                                    ></button>
                                </div>
                                
                                <div class="modal-footer">
                                    <button
                                        type="button"
                                        class="btn btn-info"
                                        data-bs-dismiss="modal"
                                    >
                                        Send
                                    </button>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Optional: Place to the bottom of scripts -->
                    
                    </div>
                    
                </div>
                
                <div
                    class="row justify-content-center align-items-center g-2 mt-3"
                >
                    <div class="col-3"><div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="" />
                        <label class="form-check-label" for="">Remember me </label>
                    </div>
                    
                    </div>
                    
                </div>
                <div
                    class="row justify-content-center align-items-center g-2 mt-3 mb-5"

                        name=""
                        id=""
                        class="btn btn-primary p-2 "
                        href="index.html"
                        role="button"
                        >Login 
                            <div
                                class="spinner-border text-info spinner-border-sm"
                                role="status"
                            >
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        
                        </a
                    >
